spring.application.name=feedback
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=feedbackdb;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload tệp đính kèm (tối đa 5 file/phiếu, 10MB/file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.max-files-per-feedback=5
app.upload.max-file-size-bytes=10485760

# Phát hiện trùng lặp 2 mức
app.feedback.idempotency-window-minutes=2
app.feedback.duplicate-window-hours=24
