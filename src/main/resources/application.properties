spring.application.name=feedback
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=feedbackdb;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload tệp đính kèm (tối đa 5 file/phiếu, 10MB/file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.max-files-per-feedback=5
app.upload.max-file-size-bytes=10485760

# Phát hiện trùng lặp 2 mức
app.feedback.idempotency-window-minutes=2
app.feedback.duplicate-window-hours=24

# Cấu hình CORS cho Frontend
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173

# Cấu hình JWT (HS256 yêu cầu secret tối thiểu 32 ký tự; khi deploy ghi đè qua biến môi trường JWT_SECRET)
app.security.jwt.secret=${JWT_SECRET:bql-feedback-dev-jwt-secret-key-minimum-32-bytes-2026}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Chống dò mật khẩu (số lần đăng nhập sai tối đa & thời gian khóa tạm)
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
