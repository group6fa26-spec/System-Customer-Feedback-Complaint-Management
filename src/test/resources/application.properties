spring.application.name=feedback-test
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=feedbackdb_test;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=target/test-uploads
app.upload.max-files-per-feedback=5
app.upload.max-file-size-bytes=10485760

app.feedback.idempotency-window-minutes=2
app.feedback.duplicate-window-hours=24

app.cors.allowed-origins=http://localhost:5173

app.security.jwt.secret=test-secret-test-secret-test-secret-1234
app.security.jwt.expiration-minutes=480
app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=15


# IA-CF05: nâng limit để các integration test cũ không bị 429
app.security.rate-limit.auth-per-minute=1000
app.security.rate-limit.feedback-per-minute=1000
